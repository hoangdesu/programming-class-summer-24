<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="fb.css">
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
    <title>Brian | Facebook Clone</title>
</head>
<body>
    <!-- top row: cover image -->
    <div id="cover-container">
        <img src="https://cms-i.autodaily.vn/du-lieu/2018/08/24/lamborghini-aventador-svj-9.jpg" alt="Cover picture: Lambo SVJ">
    </div>

    <!-- 2nd row: profile info -->
    <div id="profile-info-container">
        <!-- left: avatar -->
        <div>
            <img src="images/avatar.jpg" alt="hoangdesu avatar" id="avatar">
        </div>

        <!-- right: info -->
        <div>
            <h1>Brian Nguyen (Hoang)</h1>
            <p>100k followers</p>
            <button id="follow-btn">Follow</button>
        </div>
    </div>

    <script src="script.js"></script>
